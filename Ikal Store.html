<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ikal Store</title>
<style>
:root{--bg:#1d4656;--bg2:#163a48;--card:#12313d;--tx:#f4f7f8;--mu:#a9c0c8;--or:#f0a30a;--ok:#2c9a5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.45}
.w{max-width:1000px;margin:0 auto;padding:0 16px}
nav{background:var(--bg2);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}nav .w{display:flex;align-items:center;gap:18px;height:58px}
.logo{font-weight:900;font-size:1.25rem;letter-spacing:.5px}.logo b{color:var(--or)}
nav a{color:var(--tx);font-size:.85rem;font-weight:700;cursor:pointer;text-decoration:none}.sp{flex:1}
.btn{background:var(--or);color:#1b1200;border:0;font:inherit;font-weight:800;padding:10px 16px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.g{background:#ffffff1f;color:var(--tx)}.btn.b{width:100%}
.hero{margin:18px 0;border-radius:16px;min-height:260px;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 300' preserveAspectRatio='xMidYMid slice'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23102a35'/><stop offset='1' stop-color='%23226079'/></linearGradient></defs><rect width='800' height='300' fill='url(%23g)'/><text x='400' y='215' text-anchor='middle' font-family='Arial Black,Helvetica,Arial,sans-serif' font-weight='900' font-size='150' fill='%23ffffff' fill-opacity='.08'>ROBLOX</text><g transform='rotate(-14 650 150)'><rect x='560' y='60' width='180' height='180' rx='28' fill='%23ffffff' fill-opacity='.9'/><rect x='622' y='122' width='56' height='56' rx='6' fill='%23163f50'/></g></svg>") center/cover;display:flex;align-items:center;padding:24px}
.hero h1{margin:0;font-size:clamp(2rem,7vw,3.4rem);text-transform:uppercase;line-height:1;text-shadow:0 3px 0 #0006}.hero p{margin:8px 0 16px;font-weight:600}
h3.s{margin:26px 0 10px;font-size:.95rem;text-transform:uppercase;letter-spacing:.5px}
.card{display:flex;gap:16px;background:var(--card);border-radius:14px;overflow:hidden;border:1px solid #ffffff14;max-width:560px;cursor:pointer}
.card img{width:200px;object-fit:cover}.card div{padding:14px}.card b{font-size:1.15rem}.card em{display:block;color:var(--or);font-style:normal;font-weight:900;font-size:1.2rem;margin:6px 0 10px}
.card p{margin:0;color:var(--mu);font-size:.85rem}
.mo{position:fixed;inset:0;background:#000b;display:none;align-items:flex-start;justify-content:center;padding:16px;z-index:20;overflow:auto}.mo.s{display:flex}
.md{background:var(--bg2);border-radius:16px;max-width:430px;width:100%;padding:18px;margin:auto}
.md h2{margin:0 0 10px;font-size:1.1rem}label{display:block;font-size:.8rem;color:var(--mu);margin:10px 0 4px}
input{width:100%;background:#ffffff14;border:1px solid #ffffff44;color:var(--tx);padding:10px 12px;border-radius:8px;font:inherit}
.qr{background:#fff;border-radius:12px;padding:6px;margin:10px auto;max-width:260px}.qr img{width:100%;display:block}
.row{display:flex;gap:8px}.row input{flex:1}.tot{display:flex;justify-content:space-between;margin:12px 0;font-weight:800}.tot span:last-child{color:var(--or);font-size:1.2rem}
.m{font-size:.8rem;color:var(--mu)}.ok{color:#7be0a5}.er{color:#ff9a9a}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.75rem;font-weight:800;background:var(--or);color:#1b1200}.badge.p{background:var(--ok);color:#fff}
.chat{background:var(--card);border-radius:10px;padding:10px;height:190px;overflow:auto;margin:10px 0 8px;display:flex;flex-direction:column;gap:6px}
.bb{max-width:80%;padding:6px 10px;border-radius:10px;font-size:.85rem;background:#ffffff1f;align-self:flex-start}.bb.me{background:var(--or);color:#1b1200;align-self:flex-end}
.ord{background:var(--card);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;gap:8px;align-items:center;justify-content:space-between;cursor:pointer}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font:inherit;margin-top:10px;width:100%}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:12px 0}.opt{background:var(--card);border:2px solid #ffffff22;color:var(--tx);border-radius:12px;padding:18px 8px;font:inherit;font-weight:900;font-size:1.05rem;cursor:pointer}.opt:hover{border-color:var(--or);color:var(--or)}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:6px}.ph>div:nth-child(2){flex:1}.av{width:42px;height:42px;border-radius:50%;background:var(--or);color:#1b1200;display:flex;align-items:center;justify-content:center;font-weight:900}
.chip{background:#ffffff1f;padding:7px 12px;border-radius:99px}
.ch{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--or);border:0;font-size:1.5rem;cursor:pointer;z-index:10;box-shadow:0 4px 14px #0006}
.tip{position:fixed;right:84px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#fff;color:#222;padding:10px 14px;border-radius:12px;z-index:10;font-size:.8rem;box-shadow:0 4px 14px #0004;cursor:pointer}.tip b{display:block;font-size:.9rem}.tip span{color:#666}
@media(max-width:560px){nav .w{gap:10px}nav a{font-size:.72rem}nav a.btn{padding:8px 10px}nav a[href="#"]{display:none}}
.pk{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:34px}.pkc{background:var(--card);border:1px solid #ffffff14;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center}.pkc b{font-size:1.25rem;color:var(--or)}
.opt.on{border-color:var(--or);color:var(--or);background:#f0a30a22}
.cw{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 32px));height:min(520px,calc(100% - 130px));background:#fff;color:#222;border-radius:16px;box-shadow:0 8px 30px #0006;z-index:15;display:flex;flex-direction:column;overflow:hidden}
.cw[hidden]{display:none}.cwb{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0}
.cwh{background:var(--or);color:#1b1200;padding:56px 20px 24px}.cwh h2{margin:0 0 6px;font-size:1.8rem}.cwh p{margin:0;font-weight:600}
.cwtop{background:var(--or);color:#1b1200;padding:14px 16px;font-weight:800}
.cwt{display:flex;border-top:1px solid #0002}.cwt button{flex:1;background:none;border:0;padding:10px;font:inherit;font-size:.75rem;color:#666;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}.cwt button.on{color:#b36f00;font-weight:800;box-shadow:inset 0 -3px var(--or)}
.cwc{display:flex;gap:12px;align-items:center;padding:12px 16px;cursor:pointer;border-bottom:1px solid #0001}.cwc:hover{background:#f5f5f5}.cwc b{display:block}.cwc .m{color:#777}.cwc .tm{margin-left:auto;font-size:.7rem;color:#888;white-space:nowrap}
.cwth{background:var(--or);color:#1b1200;padding:10px 12px;display:flex;align-items:center;gap:8px}.cwth .ph{margin:0}.cwth .badge{background:#1b1200;color:#fff}.cwth .m{color:#1b1200}
.cw .chat{background:#fafafa;margin:0;border-radius:0;height:auto;flex:1;min-height:0}.cw .bb{background:#ececec;color:#222}.cw .bb.me{background:var(--or);color:#1b1200}
.cw input{background:#f2f2f2;color:#222;border-color:#ddd}.cw .row{padding:8px}
.btn.on{outline:2px solid var(--or)}
footer{text-align:center;color:var(--mu);font-size:.8rem;padding:30px 16px 40px}
</style>
</head>
